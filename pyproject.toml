# applied-odcs: one governed MCP tool behind an AgentCore Gateway.  Not a
# package; this file pins the engine and the dev tools the Makefile runs.
[project]
name = "applied-odcs"
version = "0.1.0"
description = "One governed MCP tool behind an AgentCore Gateway, with cedar-odcs deciding every call"
requires-python = ">=3.12"
dependencies = [
    "cedar-odcs @ git+https://github.com/samdengler/cedar-odcs.git@v0.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "boto3>=1.35",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["orders/tests"]
